<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ridham's personal blog — thoughts on security, technology, and beyond.">
  <title>{{ title }} — Ridham's Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">
        <a href="/">RasenRhino</a>
      </h1>
      <nav class="site-nav" aria-label="Main navigation">
        {% for link in nav_links %}
        <a href="{{ link.url }}"{% if link.title == title %} aria-current="page"{% endif %}>{{ link.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="container">
    <article class="post">
      {{ content | safe }}
    </article>

    {% if listing %}
    <aside class="post-list">
      <ul>
        {% for item in listing %}
        <li><a href="{{ item.url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </aside>
    {% endif %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ year }} RasenRhino. No rights reserved.</p>
    </div>
  </footer>
</body>
</html>
